name: Windows Build (Electron)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            build_script: build:win
            artifact_name: nexo-employees-windows-x64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Release tag $GITHUB_REF_NAME does not match package version $expected"
            exit 1
          }

      - name: Build app (${{ matrix.arch }})
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run ${{ matrix.build_script }}

      - name: Build and publish OTA release (${{ matrix.arch }})
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
